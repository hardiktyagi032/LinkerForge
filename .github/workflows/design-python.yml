name: Design architecture CPU checks

on:
  push:
    branches:
      - "codex/design-*"
      - codex/fusion-linker-generator
      - codex/attachment-site-scorer
  pull_request:
    branches:
      - main
      - integration
      - codex/dfl-research-handoff
      - codex/fusion-linker-generator
      - codex/attachment-site-scorer
      - codex/design-pipeline-readiness

permissions:
  contents: read

concurrency:
  group: design-cpu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  geometry:
    name: Geometry / Python 3.11 / standard library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify existing geometry fixtures without scientific jobs
        run: python scripts/verify_design_architecture.py --scope geometry --output tmp/design-ci/geometry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: geometry-software-checks
          path: tmp/design-ci/geometry.json
          if-no-files-found: warn

  models:
    name: Model wiring / Python 3.14 / Windows CPU
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/generator-cpu.txt
      - name: Install pinned CPU runtime (no protein weights or datasets)
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r requirements/generator-cpu.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run bounded model/software regressions
        run: python scripts/verify_design_architecture.py --scope models --output tmp/design-ci/models.json
      - name: Build Python wheel without installing a training service
        run: python -m pip wheel --no-deps . --wheel-dir tmp/design-ci/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: model-software-checks-and-wheel
          path: tmp/design-ci/
          if-no-files-found: warn
